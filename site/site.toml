# The guide's shared settings. site/build.py reads this file first, then each page in `pages`, in order.
title = "AI-SDLC landing zone"
description = "One repository where an app and all seven GitHub AI-SDLC accelerators run the software development lifecycle end to end, with a person at every decision."
repository = "melabadi/ai-sdlc-landing-zone"
source = "melabadi/adept-assessment-northstars"
# The screenshots of the run, relative to the repository root. docs/see-it-work/README.md shows the same files.
images = "docs/see-it-work/images"
pages = [
  "home.toml",
  "plan.toml",
  "design.toml",
  "develop.toml",
  "test.toml",
  "secure.toml",
  "release.toml",
  "operate.toml",
  "results.toml",
]

# What [#N] links to in a text field: an Issue or a pull request of the run.
[refs]
issues = [13, 15, 18, 19, 20, 21, 22, 23, 26, 28, 32, 33]
pulls = [14, 16, 17, 24, 27, 29, 30, 31, 34]
