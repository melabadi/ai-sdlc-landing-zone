[[criteria]]
criterion = '''Every test suite passes on the release commit'''
check = '''The candidate's test gate'''
result = '''API and worker tests: 79 of 79. Web UI tests: 17 of 17'''
state = "met"

[[criteria]]
criterion = '''The images that ship are the images tested'''
check = '''The smoke test and the browser tests, on the pushed images, by digest'''
result = '''9 of 9 each'''
state = "met"

[[criteria]]
criterion = '''Every release file can be checked'''
check = '''`SHA256SUMS`, and `release-manifest.json`, which ties the files to the commit and the image digests'''
result = '''Attached'''
state = "met"

[[criteria]]
criterion = '''Approval comes only from `main`'''
check = '''The `release-github` environment's branch rule'''
result = '''`demo/not-main` refused'''
state = "met"

[[criteria]]
criterion = '''A person approves, with the evidence verified'''
check = '''The approval workflow's evidence checks, then the environment's required reviewer'''
result = '''10 of 10 checks; approved by the owner'''
state = "met"

[[criteria]]
criterion = '''The published release matches its evidence'''
check = '''`release_evidence.py verify --expect published`'''
result = '''8 passed, 1 skipped, 0 failed. The skipped check reads the image digests, which needs a token with access to packages'''
state = "met"
