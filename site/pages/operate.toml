[[criteria]]
criterion = '''A timeout while the worker runs doesn't throw: Attempts is 1, LastError is set, and the retry waits with backoff'''
check = '''`Timed_out_delivery_is_retried_with_backoff`'''
result = '''Fails before the fix, passes after'''
state = "met"

[[criteria]]
criterion = '''At `MaxAttempts`, the notification is Failed and counted in the backlog'''
check = '''`Timed_out_delivery_is_failed_after_max_attempts_and_counted_in_backlog`'''
result = '''Fails before the fix, passes after'''
state = "met"

[[criteria]]
criterion = '''A worker shutdown still cancels'''
check = '''`Cancellation_during_delivery_still_propagates`'''
result = '''Passes before and after'''
state = "met"

[[criteria]]
criterion = '''When one notification times out, the batch's others are saved as Sent, and not redelivered'''
check = '''`Timed_out_delivery_does_not_prevent_other_batch_deliveries`'''
result = '''Fails before the fix, passes after'''
state = "met"

[[criteria]]
criterion = '''The new test fails on `main` and passes with the change'''
check = '''*Prove the regression test*'''
result = '''PROVEN'''
state = "met"

[[criteria]]
criterion = '''Every existing test passes, and nothing is weakened'''
check = '''CI; the diff'''
