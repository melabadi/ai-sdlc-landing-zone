[[criteria]]
criterion = '''Copilot works as `secure-github`'''
check = '''The assignment'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''The supplied regression is copied unchanged, and committed first, on its own, with real failed assertions'''
check = '''The trusted replay compares it with the reference, and runs it before the repair'''
result = '''Met: 6 of 10 cases fail before'''
state = "met"

[[criteria]]
criterion = '''The fix changes only `ListAsync`, keeping role and department scope, public ids, filters, ordering, and pagination'''
check = '''The replay refuses a repair that changes any other file; the regression's visibility cases'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''The identical regression passes after the repair, and so does the full suite'''
check = '''The trusted replay'''
result = '''PASS: 10 of 10, and the full suite'''
state = "met"

[[criteria]]
criterion = '''The fix is a separate commit; both SHAs and the commands are in the pull request; it targets the lab branch, never `main`'''
check = '''The pull request'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''A person runs the trusted replay and requests a fresh review, and CodeQL rescans'''
check = '''The replay; a new Copilot code review; a CodeQL scan that expects the alert gone'''
