[[criteria]]
criterion = '''1. Only a reviewer or admin with access to both departments can confirm; anyone else gets `403`, and requesters never see the button'''
check = '''Integration tests for a requester, an approver who isn't a reviewer, a reviewer without access to the current or the suggested department, and an admin; the reviewer's browser test'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''2. Confirming reroutes the request when the department differs, and marks the recommendation `Confirmed`; priority, decision, and approval status don't change'''
check = '''Integration tests for a different and for the same department; the reviewer's browser test'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''3. Exactly one `triage.confirmed` audit entry, shown in History as **Routing confirmed: {department}**, in English and French'''
check = '''Integration and web unit tests; the reviewer's browser test reads History'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''4. A stale recommendation is refused with `409` and `recommendation.stale`'''
check = '''Integration tests for a superseded recommendation and for a department changed since, and Copilot's own race test; the reviewer's browser test'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''5. Confirming again returns `409` and `recommendation.already_confirmed`, and writes no audit entry'''
check = '''Integration test'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''6. A closed request returns `409` and `request.terminal`'''
check = '''Integration test'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''7. **Confirm routing** shows only when the user may confirm; afterwards the panel shows **Confirmed by {name}**'''
check = '''Web unit tests; the reviewer's browser test'''
result = '''Failed first: the panel also showed the stale notice. Met after Copilot's fix'''
state = "fixed"

[[criteria]]
criterion = '''8. An additive contract change, and a test for each criterion'''
check = '''*API contract compatibility*; the tests above'''
result = '''Met'''
state = "met"

