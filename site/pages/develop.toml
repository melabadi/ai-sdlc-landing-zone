[[steps]]
lane = "person"
label = "Files the feature"
ref = "Issue #26"
title = "A person files the feature."
text = '''Issue [#26], in the *Develop: bounded feature for Copilot* form's format, comes from the accelerator's [`feature-issue.md`](https://github.com/melabadi/adept-assessment-northstars/blob/main/solutions/03-develop-github/feature-issue.md): a reviewer confirms the recommended routing department, for backlog task #21. The owner assigned it to Copilot with `develop-github`.'''

[[steps.images]]
file = "03-develop-1-issue.png"
alt = '''Issue #26, "Develop: reviewer confirms the recommended routing department", naming backlog item #21 and tracing to transcript decisions and a governance policy'''

[[steps]]
lane = "copilot"
role = "Copilot cloud agent"
label = "Builds it, with a test per criterion"
ref = "PR #27"
title = "Copilot builds it, with tests."
text = '''In [#27], Copilot added the confirmation endpoint, the audit entry, the UI, and the additive contract change, with tests for every criterion. It also found two problems in its own first draft, and fixed each one test-first: a race between a confirmation and a change to the request, and tool-call audits lost on stale results.'''

[[steps.images]]
file = "03-develop-2-session.png"
alt = '''Copilot's session summary for the feature: the tests by acceptance criterion, starting with roles and access'''

[[steps.images]]
file = "03-develop-3-commits.png"
alt = '''The commits of pull request #27: the plan, the feature, a failing regression test for the confirmation race, its fix, a failing regression for audit preservation, and its fix'''

[[steps]]
lane = "check"
label = "Bounds and CI pass"
ref = "6904201"
title = "The checks pass."
text = '''*Feature stays within its bounds* and CI passed on Copilot's last commit, [`6904201`](prc:27/6904201).'''

[[steps.images]]
file = "03-develop-4-bounds.png"
alt = '''The feature bounds check on pull request #27: Feature stays within its bounds passed'''

[[steps]]
lane = "person"
role = "The reviewer"
label = "Adds a test of their own"
ref = "7030a99"
gate = { text = "Browser tests", state = "fail" }
title = "The reviewer adds a test of their own, and it fails."
text = '''The Develop README has the reviewer write their own test. Here the session wrote it for the owner, from criteria 1, 2, 3, 4, and 7: [`confirm-routing.spec.ts`](blob:app/web/e2e/confirm-routing.spec.ts). CI's *Browser tests* failed at line 37 ([run](run:44102782452)). Ben had confirmed a recommendation that moved a misrouted request to IT. The panel then showed **Confirmed by Ben Okafor** and also **Stale: request was rerouted since this suggestion**, though that reroute was the confirmation itself.'''

[[steps.images]]
file = "03-develop-5-reviewer-test-failed.png"
alt = '''The CI run on commit 7030a99: Browser tests failed, while API and worker tests and Web UI checks passed'''

[[steps.images]]
file = "03-develop-5b-reviewer-test-output.png"
alt = '''The failing browser test's output: 1 failed and 8 passed, with the failure at line 37 of the reviewer's test'''

[[steps]]
lane = "person"
role = "The reviewer"
label = "Hands it back"
ref = "@copilot"
title = "The reviewer hands it back to Copilot."
text = '''With `@copilot`: fix the code, never the test.'''

[[steps.images]]
file = "03-develop-6-finding.png"
alt = '''The comment to @copilot: the reviewer's browser test fails at line 37 because the triage panel shows both "Confirmed by Ben Okafor" and "Stale: request was rerouted since this suggestion"; fix the code, never the test'''

[[steps]]
lane = "copilot"
role = "Copilot cloud agent"
label = "Fixes the code, not the test"
ref = "5bf93b8"
gate = { text = "9 of 9 browser tests", state = "pass" }
title = "Copilot fixes the code."
text = '''Its commit, [`5bf93b8`](prc:27/5bf93b8), hides the stale notice once the routing is confirmed: 4 lines in `TriagePanel.tsx`, and its unit test. The reviewer's test is unchanged, and all 9 browser tests pass.'''

[[steps.images]]
file = "03-develop-7-fixed.png"
alt = '''The CI run on the fix: API and worker tests, Web UI checks, and Browser tests passed'''

[[steps]]
lane = "person"
label = "Approves and merges"
ref = "0a7f181"
title = "A person approves and merges."
text = '''The owner approved the feature, and it merged into `main` as [`0a7f181`](commit:0a7f181). #26 closed.'''

[[steps.images]]
file = "03-develop-8-decision.png"
alt = '''The owner's decision on pull request #27: approved and merged into main, with what was checked'''

