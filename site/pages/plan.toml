[[criteria]]
criterion = '''One epic and exactly four bounded tasks, with owner roles, dependencies, and Given/When/Then acceptance criteria'''
check = '''*Validate the brief*: the schema, and testable criteria'''
result = '''VALID: 4 tasks'''
state = "met"

[[criteria]]
criterion = '''Every item cites the transcript paragraph (T01 to T24) or the policy it comes from'''
check = '''*Validate the brief*: real citations'''
result = '''VALID'''
state = "met"

[[criteria]]
criterion = '''Conflicts and unknowns are recorded, never guessed'''
check = '''The brief, read by the owner'''
result = '''4 open questions. Of 2 conflicts, the notes resolve one (T19 defers automatic routing). The other, whether computing equipment above the spend threshold goes to Finance or IT (T06 and T07), is left to a person'''
