# Phase 01, Plan. Steps, artifacts, acceptance criteria, and next step of the recorded run.
kind = "phase"
slug = "plan"
number = 1
name = "Plan"
title = "Notes to a published backlog"
accelerator = "solutions/01-plan-github"
lead = '''The Plan accelerator turns stakeholder notes into a brief and a backlog in which every statement cites its source. It publishes the backlog only once a person approves it.'''
criteria_source = "[#13]"
next = '''Design takes task [#19] ([phase 02](page:design)), and Develop takes task [#21] ([phase 03](page:develop)). Tasks [#20] and [#22] stay in the backlog, and the conflict between T06 and T07 waits for a person's decision.'''

[overview]
output = ["brief", "backlog"]
starts = '''The *Plan: refine requirements with Copilot* form, or `copilot --agent plan-github` with [`planning/refine-task.md`](blob:planning/refine-task.md)'''
copilot = '''Drafts a brief and a backlog that cite [the notes](tree:planning/inputs)'''
gate = '''*Validate the brief*: the schema, real citations, testable criteria'''
person = '''Applies `brief-approved`, which publishes the epic and its tasks as Issues'''

[facts]
starts = '''Issue [#13], in the Plan form's format'''
produces = '''A brief and a backlog that cite the notes, in [#14]'''
complete = '''*Validate the brief*: VALID'''
decides = '''Approves the brief, and its label publishes the backlog'''

[[steps]]
lane = "person"
label = "Asks for the brief"
ref = "Issue #13"
title = "A person asks for the brief."
text = '''Issue [#13], in the *Plan: refine requirements with Copilot* form's format, is assigned to Copilot with the `plan-github` agent. It asks for one epic and four bounded tasks from the workshop transcript and the routing policies in [`planning/inputs/`](tree:planning/inputs).'''

[[steps.images]]
file = "01-plan-1-issue.png"
alt = '''Issue #13, "Plan: refine assisted-triage requirements", asking Copilot to refine the RequestHub assisted request triage requirements with the requirements-traceability skill'''

[[steps]]
lane = "copilot"
role = "Copilot cloud agent"
label = "Drafts the brief and the backlog"
ref = "PR #14"
title = "Copilot drafts the brief and the backlog."
text = '''Copilot opened draft pull request [#14] within seconds. Its session wrote `planning/brief/backlog.json` and `brief.md`, and changed nothing else.'''

[[steps.images]]
file = "01-plan-2b-session.png"
alt = '''Copilot's session for the brief, listing planning/brief/brief.md and planning/brief/backlog.json among its changes'''

[[steps]]
lane = "check"
label = "Validates the brief"
ref = "VALID"
title = "A check validates them."
text = '''Copilot's push started no workflow until a person approved its runs. *Validate the brief* then reported `VALID - 4 tasks, 4 open questions, 1/2 conflicts unresolved`.'''

[[steps.images]]
file = "01-plan-3-validate.png"
alt = '''The "Validate the brief" job of the Plan workflow on pull request #14: the brief validation summary'''

[[steps.images]]
file = "01-plan-4-brief.png"
alt = '''The planning/brief folder in the repository: backlog.json and brief.md, next to the inputs'''

[[steps]]
lane = "person"
label = "Approves; the backlog is published"
ref = "brief-approved"
gate = { text = "Published #18 to #22", state = "pass" }
title = "A person approves, and the backlog is published."
text = '''The owner approved the brief, and the `brief-approved` label started the publisher ([run](run:44095785412)). It created epic [#18] and its four tasks as Issues, each with its source excerpts. The brief merged into `main`, and #13 closed.'''

[[steps.images]]
file = "01-plan-5-published.png"
alt = '''Pull request #14, merged: the comment "Backlog published after review", listing the epic and its four tasks'''

[[steps.images]]
file = "01-plan-2-pull-request.png"
alt = '''Pull request #14, "Refine assisted-triage requirements backlog", merged into main from Copilot's branch'''

