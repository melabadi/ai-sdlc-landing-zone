# The results: what the run found, what it cost, and how to run it again.
kind = "results"
slug = "results"
nav_title = "What the run found"
eyebrow = "Results"
title = "What the run found, and what it cost"
lead = '''Seven things the run surfaced that a single accelerator's run doesn't show, the AI credits and runner minutes it used, and what to change before you run a phase again.'''
findings_lead = '''Each one is in the run's artifacts, and most changed how the landing zone is set up.'''

[[findings]]
title = '''Copilot's pull requests carry the name of whoever assigns Copilot.'''
text = '''Copilot cloud agent opened every pull request and pushed every commit in the owner's account, with Copilot as co-author: "Copilot started work on behalf of melabadi". GitHub doesn't let authors approve their own pull requests, so the owner recorded each decision as a comment review that starts "Decision:". The Test accelerator's review evidence counts only approvals and requested changes, so it shows the decision as pending. In a team, the reviewer who decides should be someone other than the person who assigned Copilot.'''

[[findings]]
title = '''A reviewer's own test is still worth writing.'''
text = '''In [Develop](page:develop#step-4), a browser test written from the acceptance criteria found a defect that Copilot's tests, its own race and audit regressions included, had missed. Copilot fixed the code and left the test alone.'''

[[findings]]
title = '''Copilot code review was most of the AI cost, and earned it.'''
text = '''Five reviews used 398.5 of about 524 AI credits; the ADR's first review alone used 133.2. They found the injection, three policy gaps in the ADR, and a fourth gap on re-review. On the repair, the review found no issues and still deferred to the trusted replay and the CodeQL rescan rather than to Copilot's own tests. Request reviews where their findings can change a decision.'''

[[findings]]
title = '''Start only the head commit's waiting runs.'''
text = '''On [#24], starting every waiting run of the branch started older commits' runs last, and their concurrency group cancelled the head commit's runs, so the session ran those again. The Operate README's command starts only the head commit's runs, which avoids it.'''

[[findings]]
title = '''Release images can collide with another repository's packages.'''
text = '''The Release accelerator pushed its images as `ghcr.io/<owner>/requesthub-*`, and the owner's account already had a `requesthub-worker` package, which belongs to the source repository. [#31] puts them under the repository's own path. Any repository whose owner already has `requesthub-*` packages elsewhere would hit it.'''

[[findings]]
title = '''One web test is flaky.'''
text = '''On `fe8c098`, a commit that changed only the ADR, *Web UI checks* failed although every test passed: Vitest reported an unhandled `ReferenceError: window is not defined` during the teardown of `DecisionPanel.test.tsx`. Running the job again passed.'''

[[findings]]
title = '''Check the triage's citations.'''
text = '''One of its line numbers was 5 lines off. Its timeline, facts, and hypotheses held, and [the proof](page:operate#step-7) confirmed the first hypothesis.'''

