[again]
lead = '''The run changed this repository: `main` now has the brief, ADR 0001, the routing confirmation, the release image path, and the timeout fix. Before you repeat a phase:'''
closing = '''The backlog, [#18] to [#22], and the incident, [#32], stay open on purpose: the backlog is the team's, and the incident's two remaining follow-ups are a person's call.'''

[[again.items]]
title = "Plan, Design, and Develop"
text = '''To start again from the same notes, question, or feature, give Copilot a base branch made from [`a60b162`](commit:a60b162), `main` before the run.'''

[[again.items]]
title = "Test and Secure"
text = '''Their labs start from `main`, as their READMEs describe. Close this run's Test lab, Issue [#15] and pull requests [#16] and [#30], as the Test README's reset does.'''

[[again.items]]
title = "Release"
text = '''Request a new version, such as `1.0.1`: `demo-v1.0.0` is published.'''

[[again.items]]
title = "Operate"
text = '''The timeout defect is fixed on `main`, so a follow-up from the sample incident would now get COVERAGE, not PROVEN. To see PROVEN, revert [`2399b96`](commit:2399b96) on a branch, and give that branch to Copilot as the base.'''
