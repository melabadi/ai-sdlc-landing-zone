# Phase 04, Test. Steps, artifacts, acceptance criteria, and next step of the recorded run.
kind = "phase"
slug = "test"
number = 4
name = "Test"
title = "A defect fixed test-first"
accelerator = "solutions/04-test-github"
lead = '''The Test accelerator has Copilot reproduce a reported defect, commit failing regression tests on their own, and only then fix the code, so a reviewer sees the tests fail before the fix and pass after it. It also explains why CI is red.'''
criteria_source = "[#15]"
next = '''In the lab, the fix stays unmerged by design, so the lab can run again; the Test README's reset closes #15, #16, and #30. On a real defect, the same pull request targets `main`, passes the same checks, and ships in the next release.'''

[overview]
output = ["tests first", "then the fix"]
starts = '''The *Test: defect to fix test-first with Copilot* form, assigned with `test-github` on a `lab/test-*` branch'''
copilot = '''Commits failing tests, then the fix; explains a red CI run'''
gate = '''*Regression tests fail before the fix and pass after it*'''
person = '''Approves the fix'''

[facts]
starts = '''Issue [#15], on the `lab/test-duplicate-decision` branch'''
produces = '''Failing tests, then the fix, in [#16]'''
complete = '''The new tests fail before the fix and pass after it: 4 of 4'''
decides = '''Approves the fix, which stays on the lab'''

