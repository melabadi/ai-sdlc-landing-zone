[[criteria]]
criterion = '''A request has at most one decision; the first wins'''
check = '''`Concurrent_approvers_record_only_the_first_decision`'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''A retry by the same approver with the same `Idempotency-Key` returns `200` with the original decision, and records nothing new'''
check = '''`Same_key_retry_returns_original_and_later_decision_conflicts`, `Concurrent_same_key_retries_create_one_decision_and_replay_the_rest`'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''Any other later attempt returns `409` and `decision.already_decided`, with the existing decision'''
check = '''`Same_key_retry_returns_original_and_later_decision_conflicts`'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''Concurrent attempts, such as a double-click or two approvers, produce exactly one `201`, and never a `500`'''
check = '''`Concurrent_double_click_records_one_decision_and_conflicts_for_the_rest`, and the other concurrent tests'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''Exactly one `decision.recorded` audit entry and one requester notification'''
check = '''The tests' shared check, `AssertSingleDecisionAndNotificationAsync`'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''Approval authority doesn't change'''
check = '''The existing authorization tests, in CI'''
result = '''Met'''
state = "met"

[[criteria]]
criterion = '''The tests fail before the fix and pass after it'''
check = '''*Regression tests fail before the fix and pass after it*'''
result = '''4 of 4'''
state = "met"

[[criteria]]
criterion = '''A person decides'''
check = '''The owner's review'''
result = '''Approved; it stays on the lab'''
state = "met"
