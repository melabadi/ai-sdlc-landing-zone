[how]
eyebrow = "How it works"
title = "Copilot proposes. Checks decide it is complete. A person decides."
lead = '''Each phase has its Copilot custom agent, its skills, its deterministic checks, and its entry point: an issue form, a command, a label, or a workflow. What the seven share is set up once.'''
accelerators = "Seven accelerators, one per phase"
caption = '''Select a phase to walk through it. In the recorded run, Test and Secure worked on lab branches with planted defects, beside the main line, and never merged.'''

[[how.principles]]
lane = "copilot"
title = "Copilot proposes"
text = '''A Copilot cloud agent session drafts the brief, the ADR, the feature, the fix, or the repair. Copilot code review and four agentic workflows review the work, explain red CI, summarize a release, and triage an incident.'''

[[how.principles]]
lane = "check"
title = "Checks decide it is complete"
text = '''Deterministic checks that a model can't argue past: the brief's validator, the ADR checker, the feature's bounds, the test-first proofs, the trusted replay, and the release gates.'''

[[how.principles]]
lane = "person"
title = "A person decides"
text = '''Only a person approves, merges, publishes, or sends the work back. The ruleset on `main` and the release environment enforce it.'''

