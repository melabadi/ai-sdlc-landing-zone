# The home page: what the landing zone is, how it works, the seven phases, what they share, and how to build your own.
kind = "home"
slug = "home"
nav_title = "The guide to an end-to-end run"
eyebrow = "GitHub Copilot · AI across the software development lifecycle"
title = "One repository. Seven phases. A person at every decision."
lead = '''
This landing zone runs an application and all seven AI-SDLC accelerators on GitHub together, from stakeholder notes to the fix for an incident. Copilot proposes, deterministic checks decide whether the work is complete, and a person makes every decision.

This guide walks through one live run of all seven, step by step, with a link to every artifact it produced.
'''

